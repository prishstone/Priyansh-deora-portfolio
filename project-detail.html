<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Priyansh Deora Portfolio</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font & Icon -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.phosphoricons.com" crossorigin>

    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        space: ['Geist', 'sans-serif']
                    },
                    colors: {
                        bg: '#F3EDFF',
                        black: '#17131F',
                        white: '#FFFFFF',
                        muted: '#AFA2C1',
                        accent: '#7057D9'
                    }
                }
            }
        }
    </script>

    <style>
        html {
            scrollbar-width: none;
        }

        html::-webkit-scrollbar {
            display: none;
        }

        body {
            scrollbar-width: none;
        }

        body::-webkit-scrollbar {
            display: none;
        }
    </style>

</head>


<body class="bg-bg overflow-x-hidden">


    <!-- Left Project Content -->
    <div class="w-1/2 px-[100px] pr-[120px] pb-[120px]">

        <div class="w-full">


            <!-- Project Intro -->
            <div class="min-h-screen flex items-center">

                <div>

                    <div class="flex items-center gap-2">

                        <h1 id="projectTitle" class="font-regular text-[32px] text-black">

                            Skyone

                        </h1>


                        <a href="index.html" class="hover:scale-[1.20] transition-transform duration-200">

                            <i class="ph ph-arrow-bend-up-left text-accent text-[16px]"></i>

                        </a>

                    </div>


                    <h2 id="projectCategory" class="font-regular text-[20px] text-muted">

                        Interior design website

                    </h2>


                    <!-- Project Link -->

                    <div class="flex w-fit h-[32px] gap-[8px] mt-[12px]">

                        <div id="projectLinkContainer"
                            class="w-[32px] h-[32px] flex items-center justify-center bg-white rounded-[8px] hover:scale-[1.12] transition-transform duration-200">

                            <a id="projectLink" href="#" target="_blank">

                                <i class="ph ph-arrow-square-out text-[16px] text-black"></i>

                            </a>

                        </div>

                    </div>


                </div>

            </div>



            <!-- Overview -->

            <div class="mb-[100px] -mt-[calc(50vh-100px)]">

                <p class="text-[14px] text-muted mb-[8px]">

                    Overview

                </p>


                <p id="projectOverview" class="text-[18px] leading-[1.5] text-black">

                </p>

            </div>



            <!-- What I worked on -->

            <div class="mb-[100px]">

                <p class="text-[14px] text-muted mb-[8px]">

                    What I worked on

                </p>


                <p id="projectWorkedOn" class="text-[18px] leading-[1.5] text-black">

                </p>

            </div>



            <!-- Challenge -->

            <div class="mb-[100px]">

                <p class="text-[14px] text-muted mb-[8px]">

                    Challenge

                </p>


                <p id="projectChallenge" class="text-[18px] leading-[1.5] text-black">

                </p>

            </div>



            <!-- Approach -->

            <div class="mb-[100px]">

                <p class="text-[14px] text-muted mb-[8px]">

                    Approach

                </p>


                <div id="projectApproach" class="text-[18px] leading-[1.5] text-black">

                </div>

            </div>



            <!-- Reflection -->

            <div class="pb-[120px]">

                <p class="text-[14px] text-muted mb-[8px]">

                    Reflection

                </p>


                <p id="projectReflection" class="text-[18px] leading-[1.5] text-black">

                </p>

            </div>


        </div>

    </div>



    <!-- Fixed Project Visual -->

    <div class="fixed left-1/2 right-[40px] top-[100px] h-[calc(100vh-200px)] rounded-2xl">


        <!-- Image -->

        <img id="projectImage" src="" class="hidden w-full h-full object-cover rounded-2xl">


        <!-- Video -->

        <video id="projectVideo" src="" class="hidden w-full h-full object-cover rounded-2xl" autoplay muted loop
            playsinline>

        </video>


    </div>



    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>



    <!-- Project Detail -->

    <script>

            (function () {


                // ----------------------------------------
                // Get project slug
                // ----------------------------------------

                const params =
                    new URLSearchParams(
                        window.location.search
                    );


                const slug =
                    params.get("slug");



                // ----------------------------------------
                // Elements
                // ----------------------------------------

                const projectTitle =
                    document.getElementById("projectTitle");


                const projectCategory =
                    document.getElementById("projectCategory");


                const projectLink =
                    document.getElementById("projectLink");


                const projectLinkContainer =
                    document.getElementById("projectLinkContainer");


                const projectOverview =
                    document.getElementById("projectOverview");


                const projectWorkedOn =
                    document.getElementById("projectWorkedOn");


                const projectChallenge =
                    document.getElementById("projectChallenge");


                const projectApproach =
                    document.getElementById("projectApproach");


                const projectReflection =
                    document.getElementById("projectReflection");


                const projectImage =
                    document.getElementById("projectImage");


                const projectVideo =
                    document.getElementById("projectVideo");



                // ----------------------------------------
                // Load project
                // ----------------------------------------

                async function loadProject() {


                    if (!slug) {

                        console.error(
                            "No project slug found."
                        );

                        return;

                    }



                    const { data, error } =
                        await window.supabaseClient

                            .from("projects")

                            .select("*")

                            .eq("slug", slug)

                            .eq("published", true)

                            .single();



                    console.log(
                        "PROJECT:",
                        data
                    );


                    console.log(
                        "PROJECT ERROR:",
                        error
                    );



                    if (error) {

                        console.error(
                            "Error loading project:",
                            error
                        );

                        return;

                    }



                    // ----------------------------------------
                    // Project information
                    // ----------------------------------------

                    projectTitle.textContent =
                        data.title || "";


                    projectCategory.textContent =
                        data.category || "";



                    // ----------------------------------------
                    // Project link
                    // ----------------------------------------

                    if (data.project_link) {

                        projectLink.href =
                            data.project_link;

                    }

                    else {

                        projectLinkContainer.classList.add(
                            "hidden"
                        );

                    }



                    // ----------------------------------------
                    // Overview
                    // ----------------------------------------

                    projectOverview.textContent =
                        data.overview || "";



                    // ----------------------------------------
                    // What I worked on
                    // ----------------------------------------

                    projectWorkedOn.textContent =
                        data.what_i_worked_on || "";



                    // ----------------------------------------
                    // Challenge
                    // ----------------------------------------

                    projectChallenge.textContent =
                        data.challenge || "";



                    // ----------------------------------------
                    // Approach
                    // ----------------------------------------

                    projectApproach.innerHTML = "";


                    if (data.approach) {


                        const points =
                            data.approach
                                .split("\n")
                                .map(function (point) {

                                    return point.trim();

                                })
                                .filter(function (point) {

                                    return point.length > 0;

                                });



                        points.forEach(function (point) {


                            const paragraph =
                                document.createElement("p");


                            paragraph.textContent =
                                point;


                            paragraph.className =
                                "mb-[16px]";


                            projectApproach.appendChild(
                                paragraph
                            );


                        });

                    }



                    // ----------------------------------------
                    // Reflection
                    // ----------------------------------------

                    projectReflection.textContent =
                        data.reflection || "";



                    // ----------------------------------------
                    // Media
                    // ----------------------------------------

                    projectImage.classList.add(
                        "hidden"
                    );


                    projectVideo.classList.add(
                        "hidden"
                    );


                    projectVideo.pause();



                    // ----------------------------------------
                    // Video
                    // ----------------------------------------

                    if (
                        data.media_type === "video" &&
                        data.media_url
                    ) {


                        projectVideo.src =
                            data.media_url;


                        projectVideo.classList.remove(
                            "hidden"
                        );


                        projectVideo.load();


                        projectVideo.play();


                    }



                    // ----------------------------------------
                    // Image
                    // ----------------------------------------

                    else if (
                        data.media_type === "image" &&
                        data.media_url
                    ) {


                        projectImage.src =
                            data.media_url;


                        projectImage.classList.remove(
                            "hidden"
                        );

                    }


                }



                // ----------------------------------------
                // Start
                // ----------------------------------------

                loadProject();


            })();

    </script>


</body>

</html>
