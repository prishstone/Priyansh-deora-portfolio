<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Priyansh Deora Portfolio</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font & Icon -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.phosphoricons.com" crossorigin>

    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        space: ['Geist', 'sans-serif']
                    },
                    colors: {
                        bg: '#F3EDFF',
                        black: '#17131F',
                        white: '#FFFFFF',
                        muted: '#AFA2C1',
                        accent: '#7057D9'
                    }
                }
            }
        }
    </script>

    <style>
        html {
            scrollbar-width: none;
        }

        html::-webkit-scrollbar {
            display: none;
        }

        body {
            scrollbar-width: none;
        }

        body::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>


<body class="bg-bg overflow-x-hidden">


    <!-- Project Visual -->
    <div class="relative w-full h-[360px] px-[24px] pt-[24px]
    md:fixed md:left-1/2 md:top-[100px]
    md:w-[calc(50vw-40px)] md:h-[calc(100vh-200px)]
    md:px-0 md:pt-0 md:rounded-2xl">

        <!-- Media Skeleton Loader -->
        <div id="mediaLoader" class="w-full h-full bg-white/40 border border-white/30 rounded-2xl animate-pulse"></div>

        <img id="projectImage" src="" class="hidden w-full h-full object-cover rounded-2xl">

        <video id="projectVideo" src="" class="hidden w-full h-full object-cover rounded-2xl" autoplay muted loop
            playsinline>
        </video>

    </div>


    <!-- Left Project Content -->
    <div class="w-full px-[24px] pt-[40px] pb-[80px] md:w-1/2 md:px-[100px] md:pt-0 md:pb-[120px]">

        <div class="w-full max-w-[560px]">


            <!-- Project Intro -->
            <div class="min-h-0 flex items-center pt-[20px] pb-[80px] md:min-h-screen md:pt-0 md:pb-0">

                <div>

                    <div class="flex items-center gap-2">

                        <h1 id="projectTitle" class="min-h-[40px] font-regular text-[32px] text-black">
                        </h1>

                        <a href="index.html" class="hover:scale-[1.20] transition-transform duration-200">

                            <i class="ph ph-arrow-bend-up-left text-accent text-[16px]">
                            </i>

                        </a>

                    </div>

                    <h2 id="projectCategory" class="min-h-[28px] font-regular text-[20px] text-muted">
                    </h2>

                    <div class="flex w-fit h-[32px] gap-[8px] mt-[12px]">

                        <div id="projectLinkContainer"
                            class="w-[32px] h-[32px] flex items-center justify-center bg-white rounded-[8px] hover:scale-[1.12] transition-transform duration-200">

                            <a id="projectLink" href="#" target="_blank">

                                <i class="ph ph-arrow-square-out text-[16px] text-black">
                                </i>

                            </a>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Overview -->
            <div class="mb-[80px] md:mb-[100px] md:-mt-[calc(50vh-100px)]">

                <p class="text-[14px] text-muted mb-[8px]">
                    Overview
                </p>

                <div id="projectOverview" class="text-[18px] leading-[1.5] text-black">
                </div>

            </div>


            <!-- What I worked on -->
            <div class="mb-[80px] md:mb-[100px]">

                <p class="text-[14px] text-muted mb-[8px]">
                    What I worked on
                </p>

                <div id="projectWorkedOn" class="text-[18px] leading-[1.5] text-black">
                </div>

            </div>


            <!-- Challenge -->
            <div class="mb-[80px] md:mb-[100px]">

                <p class="text-[14px] text-muted mb-[8px]">
                    Challenge
                </p>

                <div id="projectChallenge" class="text-[18px] leading-[1.5] text-black">
                </div>

            </div>


            <!-- Approach -->
            <div class="mb-[40px] md:mb-[100px]">
                <p class="text-[14px] text-muted mb-[8px]">
                    Approach
                </p>

                <div id="projectApproach" class="text-[18px] leading-[1.5] text-black">
                </div>
            </div>


            <!-- Impact -->
            <div class="mb-[40px] md:mb-[100px]">

                <p class="text-[14px] text-muted mb-[8px]">
                    Impact
                </p>

                <div id="projectImpact" class="text-[18px] leading-[1.5] text-black">
                </div>

            </div>


            <!-- Reflection -->
            <div class="pb-[80px] md:pb-[120px]">

                <p class="text-[14px] text-muted mb-[8px]">
                    Reflection
                </p>

                <div id="projectReflection" class="text-[18px] leading-[1.5] text-black">
                </div>

            </div>


        </div>

    </div>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <!-- Project Detail -->
    <script>

            (function () {


                // ----------------------------------------
                // Get project slug
                // ----------------------------------------

                const params = new URLSearchParams(
                    window.location.search
                );

                const slug = params.get("slug");


                // ----------------------------------------
                // Elements
                // ----------------------------------------

                const projectTitle =
                    document.getElementById("projectTitle");

                const projectCategory =
                    document.getElementById("projectCategory");

                const projectLink =
                    document.getElementById("projectLink");

                const projectLinkContainer =
                    document.getElementById("projectLinkContainer");

                const projectOverview =
                    document.getElementById("projectOverview");

                const projectWorkedOn =
                    document.getElementById("projectWorkedOn");

                const projectChallenge =
                    document.getElementById("projectChallenge");

                const projectApproach =
                    document.getElementById("projectApproach");

                const projectImpact =
                    document.getElementById("projectImpact");

                const projectReflection =
                    document.getElementById("projectReflection");

                const projectImage =
                    document.getElementById("projectImage");

                const projectVideo =
                    document.getElementById("projectVideo");

                const mediaLoader =
                    document.getElementById("mediaLoader");


                // ----------------------------------------
                // Load project
                // ----------------------------------------

                async function loadProject() {

                    function hideMediaLoader() {
                        if (mediaLoader) {
                            mediaLoader.classList.add("hidden");
                        }
                    }


                    if (!slug) {

                        console.error(
                            "No project slug found."
                        );

                        hideMediaLoader();

                        return;

                    }


                    const { data, error } =
                        await window.supabaseClient
                            .from("projects")
                            .select("*")
                            .eq("slug", slug)
                            .eq("published", true)
                            .single();


                    console.log(
                        "PROJECT:",
                        data
                    );

                    console.log(
                        "PROJECT ERROR:",
                        error
                    );


                    if (error || !data) {

                        console.error(
                            "Error loading project:",
                            error
                        );

                        hideMediaLoader();

                        return;

                    }


                    // ----------------------------------------
                    // Project information
                    // ----------------------------------------

                    projectTitle.textContent =
                        data.title || "";

                    projectCategory.textContent =
                        data.category || "";


                    // ----------------------------------------
                    // Project link
                    // ----------------------------------------

                    if (data.project_link) {

                        projectLink.href =
                            data.project_link;

                    }

                    else {

                        projectLinkContainer.classList.add(
                            "hidden"
                        );

                    }


                    // ----------------------------------------
                    // Text content
                    // ----------------------------------------

                    // Overview
                    projectOverview.innerHTML = "";

                    if (data.overview) {

                        const points =
                            data.overview
                                .split("\n")
                                .map(function (point) {
                                    return point.trim();
                                })
                                .filter(function (point) {
                                    return point.length > 0;
                                });

                        points.forEach(function (point) {

                            const paragraph =
                                document.createElement("p");

                            paragraph.textContent =
                                point;

                            paragraph.className =
                                "mb-[16px]";

                            projectOverview.appendChild(
                                paragraph
                            );

                        });

                    }


                    // What I worked on
                    projectWorkedOn.innerHTML = "";

                    if (data.what_i_worked_on) {

                        const points =
                            data.what_i_worked_on
                                .split("\n")
                                .map(function (point) {
                                    return point.trim();
                                })
                                .filter(function (point) {
                                    return point.length > 0;
                                });

                        points.forEach(function (point) {

                            const paragraph =
                                document.createElement("p");

                            paragraph.textContent =
                                point;

                            paragraph.className =
                                "mb-[16px]";

                            projectWorkedOn.appendChild(
                                paragraph
                            );

                        });

                    }


                    // Challenge
                    projectChallenge.innerHTML = "";

                    if (data.challenge) {

                        const points =
                            data.challenge
                                .split("\n")
                                .map(function (point) {
                                    return point.trim();
                                })
                                .filter(function (point) {
                                    return point.length > 0;
                                });

                        points.forEach(function (point) {

                            const paragraph =
                                document.createElement("p");

                            paragraph.textContent =
                                point;

                            paragraph.className =
                                "mb-[16px]";

                            projectChallenge.appendChild(
                                paragraph
                            );

                        });

                    }


                    // Approach
                    projectApproach.innerHTML = "";

                    if (data.approach) {

                        const points =
                            data.approach
                                .split("\n")
                                .map(function (point) {
                                    return point.trim();
                                })
                                .filter(function (point) {
                                    return point.length > 0;
                                });

                        points.forEach(function (point) {

                            const paragraph =
                                document.createElement("p");

                            paragraph.textContent =
                                point;

                            paragraph.className =
                                "mb-[16px]";

                            projectApproach.appendChild(
                                paragraph
                            );

                        });

                    }


                    // ----------------------------------------
                    // Impact
                    // ----------------------------------------

                    projectImpact.innerHTML = "";

                    const impactData =
                        data.impact || data.project_impact;

                    if (impactData) {

                        const points =
                            impactData
                                .split("\n")
                                .map(function (point) {
                                    return point.trim();
                                })
                                .filter(function (point) {
                                    return point.length > 0;
                                });

                        points.forEach(function (point) {

                            const paragraph =
                                document.createElement("p");

                            paragraph.textContent =
                                point;

                            paragraph.className =
                                "mb-[16px]";

                            projectImpact.appendChild(
                                paragraph
                            );

                        });

                    }


                    // ----------------------------------------
                    // Reflection
                    // ----------------------------------------

                    projectReflection.innerHTML = "";

                    if (data.reflection) {

                        const points =
                            data.reflection
                                .split("\n")
                                .map(function (point) {
                                    return point.trim();
                                })
                                .filter(function (point) {
                                    return point.length > 0;
                                });

                        points.forEach(function (point) {

                            const paragraph =
                                document.createElement("p");

                            paragraph.textContent =
                                point;

                            paragraph.className =
                                "mb-[16px]";

                            projectReflection.appendChild(
                                paragraph
                            );

                        });

                    }


                    // ----------------------------------------
                    // Media
                    // ----------------------------------------

                    if (
                        data.media_type === "video" &&
                        data.media_url
                    ) {
                        let handled = false;

                        function onVideoReady() {
                            if (handled) return;
                            handled = true;
                            cleanup();
                            hideMediaLoader();
                            projectVideo.classList.remove(
                                "hidden"
                            );
                            projectVideo.play().catch(function () { });
                        }

                        function onVideoError() {
                            if (handled) return;
                            handled = true;
                            cleanup();
                            hideMediaLoader();
                        }

                        function cleanup() {
                            projectVideo.removeEventListener("loadeddata", onVideoReady);
                            projectVideo.removeEventListener("canplay", onVideoReady);
                            projectVideo.removeEventListener("error", onVideoError);
                        }

                        projectVideo.addEventListener("loadeddata", onVideoReady);
                        projectVideo.addEventListener("canplay", onVideoReady);
                        projectVideo.addEventListener("error", onVideoError);

                        projectVideo.src =
                            data.media_url;

                        projectVideo.load();

                        if (projectVideo.readyState >= 2) {
                            onVideoReady();
                        }
                    }

                    else if (
                        data.media_type === "image" &&
                        data.media_url
                    ) {
                        let handled = false;

                        function onImageReady() {
                            if (handled) return;
                            handled = true;
                            cleanup();
                            hideMediaLoader();
                            projectImage.classList.remove(
                                "hidden"
                            );
                        }

                        function onImageError() {
                            if (handled) return;
                            handled = true;
                            cleanup();
                            hideMediaLoader();
                        }

                        function cleanup() {
                            projectImage.removeEventListener("load", onImageReady);
                            projectImage.removeEventListener("error", onImageError);
                        }

                        projectImage.addEventListener("load", onImageReady);
                        projectImage.addEventListener("error", onImageError);

                        projectImage.src =
                            data.media_url;

                        if (projectImage.complete) {
                            if (projectImage.naturalWidth !== 0) {
                                onImageReady();
                            } else {
                                onImageError();
                            }
                        }
                    }

                    else {
                        hideMediaLoader();
                    }

                }


                // ----------------------------------------
                // Start
                // ----------------------------------------

                loadProject();


            })();

    </script>


</body>
<script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>

</html>
