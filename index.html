<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Priyansh Deora Portfolio</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <!--Font & Icon -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.phosphoricons.com" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            space: ['Geist', 'sans-serif']
          },
          colors: {
            bg: '#F3EDFF',
            black: '#17131F',
            white: '#FFFFFF',
            muted: '#AFA2C1',
            accent: '#7057D9'
          }
        }
      }
    }
  </script>
</head>

<body class="bg-bg overflow-hidden">

  <!-- Home -->
  <div class="min-h-screen flex items-center justify-between px-[100px]">

    <!-- Intro -->
    <div class="w-fit h-fit flex flex-col justify-center">

      <div class="flex items-center gap-2">
        <h1 class="font-regular text-[32px] text-black">
          Priyansh Deora
        </h1>

        <i class="ph ph-arrow-bend-up-right text-accent text-[16px]"></i>
      </div>

      <h2 class="font-regular text-[20px] text-muted">
        Product Designer, UX Strategist & UI Engineer
      </h2>

      <div class="flex w-fit h-[32px] gap-[8px] mt-[12px]">

        <div class="w-[32px] h-[32px] flex items-center justify-center bg-white rounded-[8px]">
          <i class="ph ph-phone text-[16px] text-black"></i>
        </div>

        <div class="w-[32px] h-[32px] flex items-center justify-center bg-white rounded-[8px]">
          <i class="ph ph-envelope text-[16px] text-black"></i>
        </div>

        <div class="w-[32px] h-[32px] flex items-center justify-center bg-white rounded-[8px]">
          <i class="ph ph-linkedin-logo text-[16px] text-black"></i>
        </div>

      </div>

    </div>


    <!-- Projects -->
    <div class="absolute right-[-40px] top-1/2 -translate-y-1/2">

      <div class="relative w-[392px] h-[318px]">

        <!-- Active Project -->
        <div id="activeProject" class="absolute left-0 top-0 w-[300px] h-[300px] bg-white rounded-[16px] p-[12px]">

          <img id="projectImage" src="ai_growth_platform.jpg" class="w-full h-[240px] object-cover rounded-[10px]">

          <p id="projectTitle" class="text-[16px] text-black mt-[12px]">
            AI Professional Growth App
          </p>

        </div>


        <!-- Upcoming Project -->
        <div id="nextProject"
          class="absolute left-[312px] top-[220px] w-[80px] h-[80px] bg-white opacity-60 rounded-[8px]">
        </div>


        <!-- Dots -->
        <div class="absolute left-0 top-[312px] w-[300px] flex justify-center gap-[8px]">

          <div class="project-dot w-[6px] h-[6px] rounded-full bg-accent"></div>

          <div class="project-dot w-[6px] h-[4px] rounded-full bg-white"></div>

          <div class="project-dot w-[6px] h-[4px] rounded-full bg-white"></div>

        </div>
      </div>

    </div>
  </div>

</body>
<script src="project.js"></script>
